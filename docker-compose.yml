services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: lisssave-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - ./data/telegram-bot-api-data:/var/lib/telegram-bot-api
      - ./data:/app/data
    expose:
      - "8081"
    networks:
      - lisssave-net

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lisssave-bot
    restart: unless-stopped
    depends_on:
      - telegram-bot-api
    env_file:
      - .env
    environment:
      LOCAL_API_URL: ${LOCAL_API_URL:-http://telegram-bot-api:8081}
    volumes:
      - ./data:/app/data
      - ./data/telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - lisssave-net

networks:
  lisssave-net:
    driver: bridge
